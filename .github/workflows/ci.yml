name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Four shards in parallel. Each runner executes a quarter of the suite and
  # uploads a blob report; the merge job stitches them into one HTML report.
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --with-deps installs the OS libraries the browsers need on a bare
      # runner. Leaving it off is the single most common CI failure.
      - run: npx playwright install --with-deps chromium

      # `npm test` names its projects explicitly, which keeps the
      # deliberately-broken `flaky-demo` project out of the gate. Running a
      # bare `npx playwright test` here would include it and CI would be red
      # by design — one source of truth for the project list instead.
      - run: npm test -- --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      # The artifact to open when a build goes red: traces, screenshots and
      # videos for every failure, all in one report.
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The Python examples in docs/python/ are documentation the repo can prove.
  # Its own job, not a step: different runtime, different package manager, and
  # it parallelises with the shards instead of waiting behind them. No `needs:`
  # for the same reason — nothing here depends on the JS suite.
  python-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/python/requirements.txt

      - run: pip install -r docs/python/requirements.txt

      # --with-deps installs the OS libraries Chromium needs on a bare runner.
      # The Python binding downloads its own browser, independent of the Node
      # one, so this is required even though the shards also install Chromium.
      - run: python -m playwright install --with-deps chromium

      - run: pytest docs/python/test_data_types.py -q
